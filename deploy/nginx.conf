# Never log request URLs, query strings, headers or IPs: survey links contain tokens.
log_format crm_safe escape=json '{"timestamp":"$time_iso8601","level":"info","method":"$request_method","status":$status,"requestId":"$upstream_http_x_request_id","durationSeconds":"$request_time"}';
access_log /var/log/nginx/access.log crm_safe;
# Ordinary upstream error diagnostics include the raw request URL. Access logs
# retain failure status/timing; backend logs retain sanitized application causes.
error_log /var/log/nginx/error.log crit;
server {
  listen 80;
  root /usr/share/nginx/html;
  # Docker DNS is re-resolved when the API container is recreated.
  resolver 127.0.0.11 valid=10s ipv6=off;
  location /api/ {
    set $api_upstream api:3000;
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
